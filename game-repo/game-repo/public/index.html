<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜拳淘汰赛</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="view-access" class="view hidden">
    <h1>未获取准入资格</h1>
    <p>当前房间已满，请稍后再试。</p>
  </div>

  <div id="view-create" class="view hidden">
    <h1>猜拳淘汰赛</h1>
    <input id="nameInput" type="text" placeholder="输入你的名字" maxlength="12">
    <button id="createBtn">创建临时账号</button>
  </div>

  <div id="view-lobby" class="view hidden">
    <h2>聊天大厅</h2>
    <div id="lobbyInfo"></div>
    <button id="readyBtn">准备</button>
    <div id="chatBox">
      <div id="chatList"></div>
      <input id="chatInput" type="text" placeholder="输入消息…">
      <button id="sendBtn">发送</button>
    </div>
    <div id="playerList"></div>
  </div>

  <div id="view-game" class="view hidden">
    <h2>猜拳对战</h2>
    <div id="matchInfo"></div>
    <div id="options">
      <button data-choice="rock">石头</button>
      <button data-choice="paper">布</button>
      <button data-choice="scissors">剪刀</button>
    </div>
    <div id="gameLog"></div>
  </div>

  <div id="view-eliminated" class="view hidden">
    <h2>你已被淘汰</h2>
    <p>你可以继续观战。</p>
    <div id="spectatorBox"></div>
  </div>

  <div id="view-winner" class="view hidden">
    <h1 id="winnerText"></h1>
  </div>

  <div id="view-stars" class="view hidden">
    <div id="stars"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
